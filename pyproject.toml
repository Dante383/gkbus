[build-system]
requires = ["flit_core >=3.2,<4","setuptools == 80.3.1"]
build-backend = "flit_core.buildapi"

[project]
requires-python = ">=3.12"
name = "gkbus"
version = "0.5.11"
readme = "README.md"
authors = [{name = "Dante", email = "dante383@protonmail.com"}]
dynamic = ["description"]
dependencies = [
  "pyserial==3.5",
  "python_can==4.6.1",
  "pyroute2==0.9.7; sys_platform == 'linux'",
  "pyusb==1.3.1; sys_platform == 'win32'",
  "gs-usb==0.3.1; sys_platform == 'win32'",
  "can-isotp==2.0.7",
  "libusb-package==1.0.30.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
lint = [
  "ruff == 0.11.4",
  "mypy == 1.15.0",
]
test = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "I",   # isort
    "ANN", # flake8 type annotations
    "RUF", # ruff-specific rules
]
fixable = ["ALL"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
disallow_untyped_defs = true
